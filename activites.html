<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activités — MI.C.L.A</title>

  <style>
    :root {
      --bg: #050912;
      --surface: #0d1727;
      --surface-2: #111d30;
      --gold: #d8b45a;
      --gold-light: #f1d98b;
      --white: #ffffff;
      --text: #dfe7f2;
      --muted: #8997aa;
      --border: rgba(216,180,90,.20);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--white);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 18px 15px 50px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(30,80,150,.40),
          transparent 40%
        ),
        radial-gradient(
          circle at 0% 50%,
          rgba(216,180,90,.05),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #081a35 0%,
          #050d1b 50%,
          #030711 100%
        );
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    /* RETOUR */

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: var(--gold-light);
      text-decoration: none;

      font-size: 13px;
      font-weight: bold;

      padding: 10px 14px;
      border-radius: 12px;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);

      transition: .3s ease;
    }

    .back:hover {
      transform: translateX(-4px);
      background: rgba(216,180,90,.08);
      border-color: var(--border);
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 30px 8px 32px;
    }

    .logo-container {
      position: relative;
      width: 105px;
      height: 105px;
      margin: 0 auto 17px;
    }

    .logo-container::before {
      content: "";
      position: absolute;
      inset: -7px;

      border-radius: 50%;
      border: 1px solid rgba(216,180,90,.30);

      animation: ring 4s ease-in-out infinite;
    }

    .logo {
      width: 105px;
      height: 105px;

      object-fit: cover;
      border-radius: 50%;

      border: 2px solid var(--gold);

      box-shadow:
        0 0 0 6px rgba(216,180,90,.06),
        0 15px 40px rgba(0,0,0,.40);

      animation: floating 4s ease-in-out infinite;
    }

    .church-name {
      color: var(--gold-light);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .church-title {
      color: #9caabd;
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .line {
      width: 60px;
      height: 2px;

      margin: 19px auto 16px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }

    .page-title {
      font-size: 29px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .page-description {
      max-width: 560px;
      margin: auto;

      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* ACTIVITÉS */

    #activities-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* CARTE */

    .activity-card {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        ),
        var(--surface);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow: 0 20px 60px rgba(0,0,0,.35);

      animation: cardAppear .7s ease both;

      transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    }

    .activity-card:hover {
      transform: translateY(-5px);

      border-color: rgba(216,180,90,.38);

      box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 35px rgba(216,180,90,.05);
    }

    .activity-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(241,217,139,.7),
        transparent
      );
    }

    /* AFFICHE */

    .poster-area {
      width: 100%;

      background:
        radial-gradient(
          circle,
          #172943,
          #030711 75%
        );

      overflow: hidden;
    }

    .poster-area img {
      width: 100%;
      height: auto;
      max-height: 680px;

      object-fit: contain;
      display: block;

      transition:
        transform .6s ease,
        filter .6s ease;
    }

    .activity-card:hover .poster-area img {
      transform: scale(1.015);
      filter: brightness(1.05);
    }

    /* CONTENU */

    .activity-content {
      padding: 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      color: var(--gold-light);

      background: rgba(216,180,90,.08);

      border: 1px solid rgba(216,180,90,.23);

      border-radius: 30px;

      padding: 7px 12px;

      font-size: 10px;
      font-weight: bold;

      margin-bottom: 13px;

      animation: badgeMove 3.5s ease-in-out infinite;
    }

    .activity-title {
      font-size: 24px;
      line-height: 1.3;
      margin-bottom: 17px;
    }

    /* DESCRIPTION */

    .description-box {
      background: rgba(255,255,255,.025);

      border: 1px solid rgba(255,255,255,.05);

      border-radius: 15px;

      padding: 16px;

      margin-bottom: 18px;
    }

    .description-title {
      color: var(--gold-light);

      font-size: 12px;
      font-weight: bold;

      margin-bottom: 9px;
    }

    .description {
      color: #c5cedb;

      font-size: 14px;
      line-height: 1.75;

      white-space: pre-line;
    }

    /* INFORMATIONS */

    .information-box {
      display: flex;
      flex-direction: column;
      gap: 9px;

      margin-bottom: 19px;
    }

    .information {
      background: rgba(255,255,255,.025);

      border: 1px solid rgba(255,255,255,.05);

      border-radius: 13px;

      padding: 13px 14px;

      color: #d9e0e9;

      font-size: 13px;

      transition: .25s ease;
    }

    .information:hover {
      transform: translateX(4px);
      background: rgba(216,180,90,.05);
      border-color: rgba(216,180,90,.16);
    }

    .information strong {
      color: var(--gold-light);
    }

    /* VIDÉO */

    .video-box {
      margin-bottom: 19px;
    }

    .video-box video {
      width: 100%;
      display: block;

      border-radius: 15px;

      background: #000;

      border: 1px solid rgba(255,255,255,.07);
    }

    /* BOUTONS */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .button {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      width: 100%;
      min-height: 48px;

      padding: 13px 16px;

      border-radius: 13px;

      text-decoration: none;
      text-align: center;

      color: white;

      font-size: 13px;
      font-weight: bold;

      background: var(--surface-2);

      border: 1px solid rgba(216,180,90,.22);

      overflow: hidden;

      transition: .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      border-color: rgba(216,180,90,.45);

      box-shadow:
        0 10px 25px rgba(0,0,0,.25);
    }

    .button-whatsapp {
      background: linear-gradient(
        135deg,
        #20c763,
        #25D366
      );

      border: none;

      animation: whatsappMove 3.5s ease-in-out infinite;
    }

    .button-link {
      background: linear-gradient(
        135deg,
        var(--gold),
        #b9903d
      );

      color: #020817;

      border: none;
    }

    /* ÉTAT VIDE */

    .empty {
      text-align: center;

      padding: 50px 25px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      border: 1px solid var(--border);

      border-radius: 22px;

      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .empty-icon {
      font-size: 42px;

      margin-bottom: 18px;

      animation: floating 3s ease-in-out infinite;
    }

    .empty h2 {
      color: var(--gold-light);
      font-size: 20px;
      margin-bottom: 10px;
    }

    .empty p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* FOOTER */

    footer {
      text-align: center;

      color: #647187;

      font-size: 11px;
      line-height: 1.7;

      margin-top: 40px;
      padding-top: 22px;

      border-top: 1px solid rgba(255,255,255,.05);
    }

    /* ANIMATIONS */

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes ring {
      0%, 100% {
        transform: scale(1);
        opacity: .7;
      }

      50% {
        transform: scale(1.05);
        opacity: .3;
      }
    }

    @keyframes badgeMove {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes whatsappMove {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .page {
        padding: 15px 12px 40px;
      }

      header {
        padding: 25px 5px 28px;
      }

      .logo-container,
      .logo {
        width: 90px;
        height: 90px;
      }

      .church-name {
        font-size: 20px;
      }

      .page-title {
        font-size: 25px;
      }

      .page-description {
        font-size: 13px;
      }

      .activity-content {
        padding: 17px;
      }

      .activity-title {
        font-size: 21px;
      }

      .description {
        font-size: 13px;
      }

      .information {
        font-size: 12.5px;
      }
    }

    @media (max-width: 360px) {

      .church-name {
        font-size: 18px;
      }

      .page-title {
        font-size: 23px;
      }

      .activity-content {
        padding: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <main class="container">

      <!-- RETOUR -->

      <a href="index.html" class="back">
        <span>←</span>
        <span>Retour à l'accueil</span>
      </a>


      <!-- HEADER -->

      <header>

        <div class="logo-container">

          <img
            src="activite.jpg"
            alt="MI.C.L.A — Activités"
            class="logo"
          >

        </div>

        <div class="church-name">
          MI.C.L.A
        </div>

        <div class="church-title">
          CITÉ DE REFUGE
        </div>

        <div class="line"></div>

        <h1 class="page-title">
          ⭐ Activités
        </h1>

        <p class="page-description">
          Retrouvez ici les affiches, annonces et informations
          des activités publiées par l'administration.
        </p>

      </header>


      <!-- ACTIVITÉS PUBLIÉES -->

      <section id="activities-container"></section>


      <!-- FOOTER -->

      <footer>
        MI.C.L.A — Cité de Refuge<br>
        © 2026 — Tous droits réservés
      </footer>

    </main>

  </div>


  <!-- JAVASCRIPT -->

  <script src="activites.js"></script>

</body>
</html>
