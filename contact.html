<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact — MI.C.L.A | Cité de Refuge</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#070b13;color:#e9eef7;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(620px,100%);padding:30px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:linear-gradient(145deg,#12233c,#09101c);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.logo{width:72px;height:72px;object-fit:cover;border-radius:18px}.muted{color:#8f9db2;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
a{display:block;padding:14px;border-radius:12px;text-decoration:none;font-weight:800}
.whatsapp{background:#d6ad55;color:#07142b}.call{border:1px solid rgba(255,255,255,.1);color:#e9eef7;background:#ffffff08}
.back{margin-top:16px;color:#d6ad55;font-size:13px}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<img src="logo.png" class="logo" alt="Logo MI.C.L.A">
<h1>Nous contacter</h1>
<p class="muted">Pour une question, une demande de prière ou une information, contactez directement le support de la MI.C.L.A — Cité de Refuge.</p>
<div class="actions">
<a id="contact-whatsapp" class="whatsapp" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
<a id="contact-call" class="call">📞 Appeler</a>
</div>
<a class="back" href="index.html">← Retour à l'accueil</a>
</main>
<script>
const fallback="243904490937";
let settings={};
try{settings=JSON.parse(localStorage.getItem("micla_settings"))||{}}catch{}
const raw=String(settings.whatsapp||settings.phone||fallback).trim();
const wa=document.getElementById("contact-whatsapp");
const call=document.getElementById("contact-call");
if(/^https?:\/\//i.test(raw)){wa.href=raw}else{const n=raw.replace(/\D/g,"");wa.href=`https://wa.me/${n}?text=${encodeURIComponent("Bonjour MI.C.L.A, je souhaite obtenir une information.")}`}
const phone=String(settings.phone||fallback).replace(/\D/g,"");
call.href=`tel:+${phone}`;
</script>
</body>
</html>
