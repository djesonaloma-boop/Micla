<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Annonces — Administration | MI.C.L.A</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#070b13;color:#e9eef7;min-height:100vh;padding:20px}
.wrap{width:min(900px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:20px}.top a{color:#d6ad55;text-decoration:none}
.card{background:#0e1624;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;margin-bottom:18px}
input,textarea{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#071120;color:white;margin:7px 0 14px;font:inherit}textarea{min-height:130px}
button{padding:12px 16px;border:0;border-radius:11px;background:#d6ad55;color:#07142b;font-weight:800;cursor:pointer}.danger{background:#30131a;color:#ffb1b8;margin-left:7px}
.item{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08)}.item:last-child{border-bottom:0}.muted{color:#8996aa;font-size:13px;line-height:1.6}.status{display:none;padding:12px;border-radius:10px;margin-bottom:14px}.status.show{display:block;background:#123322;color:#9ae7bd}
</style>
<script src="admin-auth.js"></script>
<script src="admin.js"></script>
</head>
<body>
<div class="wrap">
<div class="top"><strong>📢 MI.C.L.A — Annonces</strong><a href="admin.html">← Dashboard</a></div>
<div id="status" class="status"></div>
<section class="card">
<h2 id="formTitle">Nouvelle annonce</h2>
<label>Titre</label><input id="title" placeholder="Ex. Culte spécial dimanche">
<label>Message</label><textarea id="message" placeholder="Écrivez l'annonce..."></textarea>
<button id="save">📢 Publier</button>
<button id="cancel" class="danger" style="display:none">Annuler</button>
</section>
<section class="card"><h2>Annonces publiées</h2><div id="list"></div></section>
</div>
<script src="admin-annonces.js"></script>
<script>requireMiclaAdmin();</script>
</body>
</html>
