<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Prédications — Administration | MI.C.L.A</title>

<style>
:root{
  --bg:#070b13;
  --bg2:#0a101c;
  --surface:#0e1624;
  --surface2:#121c2c;
  --surface3:#172338;

  --gold:#d6ad55;
  --gold2:#f1d58b;
  --goldSoft:rgba(214,173,85,.10);

  --white:#fff;
  --text:#e9eef7;
  --muted:#8996aa;
  --muted2:#647187;

  --border:rgba(255,255,255,.075);
  --goldBorder:rgba(214,173,85,.24);

  --success:#35c58b;
  --danger:#e85d6a;

  --radius:18px;
  --radiusLg:26px;
  --shadow:0 20px 60px rgba(0,0,0,.32);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(214,173,85,.08),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(30,72,130,.15),transparent 30%),
    linear-gradient(180deg,var(--bg),#04070d);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,11,19,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 20px;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:relative;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  min-width:0;
}

.brand img{
  width:47px;
  height:47px;
  border-radius:13px;
  object-fit:cover;
  border:1px solid var(--goldBorder);
  box-shadow:0 8px 25px rgba(0,0,0,.3);
  transition:.3s ease;
}

.brand:hover img{
  transform:scale(1.04) rotate(-2deg);
}

.brand strong{
  display:block;
  color:white;
  font-size:15px;
  letter-spacing:.3px;
}

.brand span{
  display:block;
  font-size:10px;
  color:var(--gold);
  margin-top:4px;
  font-weight:700;
  letter-spacing:.7px;
}

nav{
  display:flex;
  gap:6px;
  align-items:center;
}

nav a{
  color:var(--text);
  text-decoration:none;
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  transition:.25s ease;
}

nav a:hover{
  background:var(--goldSoft);
  border-color:var(--goldBorder);
  color:var(--gold2);
  transform:translateY(-1px);
}

.menu{
  display:none;
  background:rgba(255,255,255,.04);
  color:var(--gold2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 12px;
  font-size:18px;
  cursor:pointer;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1200px;
  margin:auto;
  padding:42px 20px 70px;
}

.hero{
  margin-bottom:26px;
  animation:fadeUp .55s ease both;
}

.hero small{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--gold2);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:10px;
  font-weight:800;
}

.hero small::before{
  content:"";
  width:22px;
  height:1px;
  background:var(--gold);
}

.hero h1{
  font-size:40px;
  line-height:1.1;
  color:white;
  margin:12px 0;
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:720px;
}

/* =========================
   LAYOUT
========================= */

.layout{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:20px;
  align-items:start;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(18,35,60,.92),
      rgba(9,16,28,.96)
    );
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  animation:fadeUp .65s ease both;
}

.layout > .card:nth-child(2){
  animation-delay:.08s;
}

.card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-100px;
  top:-100px;
  border-radius:50%;
  background:rgba(214,173,85,.045);
  pointer-events:none;
}

.card h2{
  color:white;
  font-size:19px;
  margin-bottom:19px;
  position:relative;
}

/* =========================
   STATUS
========================= */

.status{
  display:none;
  padding:12px 14px;
  border-radius:11px;
  margin-bottom:14px;
  font-size:12px;
  font-weight:700;
}

.status.show{
  display:block;
  background:rgba(53,197,139,.08);
  border:1px solid rgba(53,197,139,.18);
  color:#9ae7bd;
}

/* =========================
   FORM
========================= */

.group{
  margin-bottom:15px;
}

label{
  display:block;
  color:#cbd7e9;
  font-size:12px;
  font-weight:800;
  margin-bottom:8px;
}

input,
textarea{
  width:100%;
  padding:13px 14px;
  border-radius:11px;
  border:1px solid var(--border);
  background:rgba(4,11,22,.75);
  color:white;
  outline:none;
  font:inherit;
  transition:.25s ease;
}

input::placeholder,
textarea::placeholder{
  color:#617088;
}

input:hover,
textarea:hover{
  border-color:rgba(214,173,85,.15);
}

input:focus,
textarea:focus{
  border-color:var(--gold);
  background:#071120;
  box-shadow:0 0 0 3px rgba(214,173,85,.07);
}

textarea{
  min-height:135px;
  resize:vertical;
  line-height:1.65;
}

input[type="url"]{
  color:#dce5f4;
}

/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

button{
  font-family:inherit;
  border-radius:11px;
  padding:12px 15px;
  cursor:pointer;
  font-weight:800;
  transition:.25s ease;
}

.primary{
  flex:1;
  border:0;
  background:linear-gradient(
    135deg,
    var(--gold),
    var(--gold2)
  );
  color:#07142b;
  box-shadow:0 8px 24px rgba(214,173,85,.12);
}

.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(214,173,85,.2);
}

.secondary{
  background:rgba(255,255,255,.04);
  color:var(--text);
  border:1px solid var(--border);
}

.secondary:hover{
  border-color:var(--goldBorder);
  background:var(--goldSoft);
  color:var(--gold2);
}

.hidden{
  display:none!important;
}

/* =========================
   PREDICATIONS
========================= */

.preachings{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.preaching{
  background:
    linear-gradient(
      160deg,
      rgba(10,27,52,.95),
      rgba(6,17,32,.95)
    );
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  transition:.3s ease;
  animation:cardIn .45s ease both;
  position:relative;
  overflow:hidden;
}

.preaching::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:100%;
  background:linear-gradient(
    180deg,
    var(--gold),
    transparent
  );
  opacity:.65;
}

.preaching:hover{
  transform:translateY(-4px);
  border-color:var(--goldBorder);
  box-shadow:0 14px 35px rgba(0,0,0,.25);
}

.icon{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:var(--goldSoft);
  border:1px solid var(--goldBorder);
  font-size:23px;
  margin-bottom:13px;
}

.preaching h3{
  color:white;
  margin-bottom:8px;
  font-size:17px;
  line-height:1.35;
}

.preaching p{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  white-space:pre-wrap;
}

.meta{
  font-size:11px;
  color:var(--gold2);
  margin-top:12px;
  display:grid;
  gap:6px;
}

.meta div{
  display:flex;
  gap:6px;
  align-items:flex-start;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.edit,
.toggle,
.delete{
  padding:10px;
  font-size:11px;
}

.edit{
  background:rgba(214,173,85,.09);
  color:var(--gold2);
  border:1px solid var(--goldBorder);
}

.edit:hover{
  background:rgba(214,173,85,.15);
}

.toggle{
  background:rgba(53,197,139,.08);
  color:#82dfb1;
  border:1px solid rgba(53,197,139,.18);
}

.toggle:hover{
  background:rgba(53,197,139,.14);
}

.delete{
  grid-column:1/-1;
  background:rgba(232,93,106,.07);
  color:#ffb0b7;
  border:1px solid rgba(232,93,106,.18);
}

.delete:hover{
  background:rgba(232,93,106,.12);
  border-color:rgba(232,93,106,.32);
}

/* =========================
   EMPTY
========================= */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 25px;
  color:var(--muted);
  border:1px dashed rgba(214,173,85,.22);
  border-radius:16px;
  background:rgba(255,255,255,.015);
}

.empty::before{
  content:"📖";
  display:block;
  font-size:34px;
  margin-bottom:10px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .preachings{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:700px){

  .header-inner{
    padding:11px 14px;
  }

  .menu{
    display:block;
  }

  nav{
    display:none;
    position:absolute;
    top:68px;
    left:14px;
    right:14px;
    background:rgba(10,16,28,.98);
    padding:8px;
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:0 18px 45px rgba(0,0,0,.4);
    flex-direction:column;
    align-items:stretch;
  }

  nav.open{
    display:flex;
    animation:fadeUp .2s ease both;
  }

  nav a{
    padding:12px 13px;
  }

  main{
    padding:29px 14px 55px;
  }

  .hero h1{
    font-size:31px;
  }

  .card{
    padding:20px;
    border-radius:20px;
  }

  .preachings{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .primary,
  .secondary{
    width:100%;
  }
}

@media(max-width:380px){

  .brand img{
    width:43px;
    height:43px;
  }

  .brand span{
    font-size:9px;
  }

  .hero h1{
    font-size:27px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
<script src="admin-auth.js"></script>
<script src="admin.js"></script>
</head>

<body>

<header>

  <div class="header-inner">

    <a href="admin.html" class="brand">

      <img
        src="admin-logo.png"
        alt="Logo MI.C.L.A"
      >

      <div>
        <strong>MI.C.L.A</strong>
        <span>Cité de Refuge · Administration</span>
      </div>

    </a>


    <button
      class="menu"
      id="menu"
      type="button"
      aria-label="Ouvrir le menu"
    >
      ☰
    </button>


    <nav id="nav">

      <a href="admin.html">
        Dashboard
      </a>

      <a href="predications.html">
        Voir les prédications
      </a>

      <a href="index.html">
        Accueil
      </a>

    </nav>

  </div>

</header>


<main>

  <section class="hero">

    <small>
      Administration
    </small>

    <h1>
      Prédications
    </h1>

    <p>
      Publie et organise les enseignements, messages
      et prédications de la Cité de Refuge.
    </p>

  </section>


  <div class="layout">

    <!-- FORMULAIRE -->

    <section class="card">

      <h2 id="formTitle">
        🎙️ Nouvelle prédication
      </h2>


      <div
        id="status"
        class="status">
      </div>


      <form id="form">

        <input
          type="hidden"
          id="id"
        >


        <div class="group">

          <label for="title">
            Titre *
          </label>

          <input
            id="title"
            placeholder="Ex : La puissance de la foi"
            required
          >

        </div>


        <div class="group">

          <label for="preacher">
            Prédicateur
          </label>

          <input
            id="preacher"
            placeholder="Ex : Pasteur Jérémie Bakadisanga"
          >

        </div>


        <div class="group">

          <label for="verse">
            Référence biblique
          </label>

          <input
            id="verse"
            placeholder="Ex : Hébreux 11:1"
          >

        </div>


        <div class="group">

          <label for="message">
            Message *
          </label>

          <textarea
            id="message"
            placeholder="Écris le contenu ou le résumé..."
            required
          ></textarea>

        </div>


        <div class="group">

          <label for="audio">
            Lien audio
          </label>

          <input
            id="audio"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="group">

          <label for="video">
            Lien vidéo
          </label>

          <input
            id="video"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="actions">

          <button
            class="primary"
            type="submit"
            id="save"
          >
            ✨ Publier
          </button>

          <button
            class="secondary hidden"
            type="button"
            id="cancel"
          >
            Annuler
          </button>

        </div>

      </form>

    </section>


    <!-- LISTE -->

    <section class="card">

      <h2>
        📖 Messages enregistrés
      </h2>

      <div
        class="preachings"
        id="preachings">
      </div>

    </section>

  </div>

</main>


<script>

/* Menu mobile */

document.addEventListener("DOMContentLoaded", () => {

  const menu = document.getElementById("menu");
  const nav = document.getElementById("nav");

  if(menu && nav){

    menu.addEventListener("click", () => {
      nav.classList.toggle("open");
    });

    nav.querySelectorAll("a").forEach(link => {

      link.addEventListener("click", () => {
        nav.classList.remove("open");
      });

    });

  }

});

</script>


<script src="admin-predications.js"></script>

<script>requireMiclaAdmin();</script>
</body>
</html>
